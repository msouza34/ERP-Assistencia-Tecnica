server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  tenant:
    default-id: ${TENANT_DEFAULT_ID:public}
  auth:
    username: ${AUTH_USERNAME:}
    password-hash: ${AUTH_PASSWORD_HASH:}
    role: ${AUTH_ROLE:ADMIN}
    legacy-enabled: ${AUTH_LEGACY_ENABLED:false}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  document:
    cnpj: ${DOCUMENT_CNPJ:}
    commercial-phone: ${DOCUMENT_COMMERCIAL_PHONE:}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/erp_assistencia}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.operonix.erp: INFO
